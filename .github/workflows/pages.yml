name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        if: github.event_name != 'schedule'
        run: pnpm test

      - name: Verify scheduled publication
        if: github.event_name != 'schedule'
        run: pnpm test:publication

      - name: Generate static site
        run: pnpm generate
        env:
          NUXT_PUBLIC_SITE_URL: https://anturkamchatka.ru
          NUXT_PUBLIC_YANDEX_METRIKA_ID: '110113081'
          NUXT_APP_BASE_URL: /

      - name: Disable Jekyll
        run: touch .output/public/.nojekyll

      - name: Check for a newer commit
        id: freshness
        run: |
          git fetch --no-tags origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping an outdated build; a newer commit is available."
          fi

      - name: Deploy branch
        if: steps.freshness.outputs.current == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: .output/public
          clean: true
          single-commit: true
